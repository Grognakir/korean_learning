<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>한국어 단어장 트레이너 — Anki style</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="wrap">
    <h1>한국어 단어장 — Anki 트레이너</h1>

    <div class="controls">
      <label class="visually-hidden" for="catSelect">Категория</label>
      <select class="cat-select" id="catSelect"></select>
      <div class="chip-row" id="dirChips"></div>
    </div>

    <div class="cat-label" id="catLabel"></div>
    <div class="stats">
      <span id="statLeft">-</span>
      <span id="statMastered">-</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>

    <div id="cardArea"></div>

    <div class="keys-hint">
      <span class="touch-only">Тап по карточке — перевернуть</span>
      <span class="desktop-only">Space — перевернуть · 1 Again · 2 Hard · 3 Good · 4 Easy</span>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
